syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

package vibelog.proxy;

// Mid-tier contract — the gateway only ever talks to this service.
// `Analyze` is the public entry point: it runs the analyzer logic and
// persists the resulting record through the database service in one hop.
service RpcLogsProxyService {
  rpc Analyze       (RpcAnalyzeRequest)            returns (RpcLogAnalysis);
  rpc ListAnalyses  (google.protobuf.Empty)        returns (RpcAnalysesList);
  rpc GetAnalysis   (RpcAnalysisId)                returns (RpcLogAnalysis);
  rpc DeleteAnalysis(RpcAnalysisId)                returns (RpcDeleteResult);
}

enum LogCategory {
  LOG_CATEGORY_UNSPECIFIED = 0;
  INFO                     = 1;
  WARNING                  = 2;
  ERROR                    = 3;
}

message RpcAnalyzeRequest {
  string raw_logs = 1;
}

message RpcAnalysisId {
  int64 id = 1;
}

message RpcLogAnalysis {
  int64                     id                  = 1;
  string                    raw_logs            = 2;
  string                    summary             = 3;
  LogCategory               category            = 4;
  string                    recommended_action  = 5;
  google.protobuf.Timestamp created_at          = 6;
}

message RpcAnalysesList {
  repeated RpcLogAnalysis analyses = 1;
}

message RpcDeleteResult {
  bool deleted = 1;
}
