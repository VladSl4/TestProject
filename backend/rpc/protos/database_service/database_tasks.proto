syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";

package vibetasks.database;

// Low-level data access contract exposed by the database service.
// Owns the schema; no other service touches storage directly.
service RpcTasksDataService {
  rpc ListTasks   (google.protobuf.Empty)   returns (RpcTasksList);
  rpc GetTask     (RpcTaskId)               returns (RpcTask);
  rpc CreateTask  (RpcCreateTaskRequest)    returns (RpcTask);
  rpc UpdateTask  (RpcUpdateTaskRequest)    returns (RpcTask);
  rpc DeleteTask  (RpcTaskId)               returns (RpcDeleteResult);
}

enum VibeStatus {
  VIBE_STATUS_UNSPECIFIED = 0;
  PENDING                 = 1;
  IN_PROGRESS             = 2;
  GROOVY                  = 3;
}

message RpcTaskId {
  int64 id = 1;
}

message RpcTask {
  int64                      id          = 1;
  string                     title       = 2;
  google.protobuf.StringValue description = 3;
  VibeStatus                 status      = 4;
  google.protobuf.StringValue mood_emoji  = 5;
  google.protobuf.Timestamp  created_at  = 6;
}

message RpcTasksList {
  repeated RpcTask tasks = 1;
}

message RpcCreateTaskRequest {
  string                     title       = 1;
  google.protobuf.StringValue description = 2;
}

message RpcUpdateTaskRequest {
  int64                      id          = 1;
  google.protobuf.StringValue title       = 2;
  google.protobuf.StringValue description = 3;
  VibeStatus                 status      = 4;
  google.protobuf.StringValue mood_emoji  = 5;
}

message RpcDeleteResult {
  bool deleted = 1;
}
